spring:
  application:
    name: spring-boot-observability

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, beans, mappings
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      status:
        http-mapping:
          down: 503
          out-of-service: 503
          fatal: 500
      group:
        external-services:
          include:
            - postApi
            - db
  tracing:
    sampling:
      probability: 1.0

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
#        all: 0.99, 0.5
        posts:
          findAll.time: 0.99, 0.5
          save.time: 0.99, 0.5
          findById.time: 0.99, 0.5
          update.time: 0.99, 0.5
          deleteById.time: 0.99, 0.5

    tags:
      department: ${SERVICE_DEPARTMENT:Software Development}
      team: ${SERVICE_TEAM:Observability}
      service: ${spring.application.name}
      env: ${SERVICE_ENVIRONMENT:dev}
      region: ${SERVICE_REGION:us-east1}
      instance.id: ${SERVICE_INSTANCE_ID:${random.uuid}}

  info:
    env:
      enabled: true
    git:
      enabled: true
      mode: full
    os:
      enabled: true
    java:
      enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

info:
  app:
    name: ${spring.application.name}
    description: This is a demo for spring boot 3 observability
    version: 1.0.0

server:
  port: 8081
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    enabled: true
    path: /api-docs

